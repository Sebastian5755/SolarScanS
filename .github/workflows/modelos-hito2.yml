name: Modelos Hito 2 (manual RAG y comparación de imágenes)

# Reproduce dos resultados del Hito 2 y los deja guardados en el repositorio:
#  1. Índice del manual de O&M (NREL) y evaluación del buscador: embeddings frente a regla fija.
#  2. Comparación de modelos preentrenados de imágenes (EfficientNet-B0, ConvNeXt-Tiny, ViT-Small).
# Se ejecuta al cambiar el código de esos componentes o manualmente desde la pestaña Actions.
# Para evaluar los embeddings se necesita el secreto GEMINI_API_KEY (Settings > Secrets and
# variables > Actions). Sin el secreto se construye el índice y se evalúa solo la regla fija.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rag/construir_indice.py'
      - 'rag/evaluar_rag.py'
      - 'rag/rag_solar.py'
      - 'rag/preguntas_eval.json'
      - 'notebooks/03_imagenes_comparacion.ipynb'
      - '.github/workflows/modelos-hito2.yml'

permissions:
  contents: write

concurrency:
  group: modelos-hito2
  cancel-in-progress: false

jobs:
  manual-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install --quiet "numpy>=1.26,<3" "httpx==0.28.1" pypdf
      - name: Descargar el manual de NREL (no se guarda en el repositorio)
        run: |
          mkdir -p rag/documentos
          curl -fL --retry 3 -A "Mozilla/5.0" -o rag/documentos/73822.pdf https://docs.nlr.gov/docs/fy19osti/73822.pdf \
            || curl -fL --retry 3 -A "Mozilla/5.0" -o rag/documentos/73822.pdf https://www.osti.gov/servlets/purl/1489002
      - name: Construir el índice de fragmentos
        run: python rag/construir_indice.py
      - name: Evaluar el buscador (embeddings y regla fija)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python rag/evaluar_rag.py
      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rag/indice_fragmentos.json rag/resultados_rag.json
          git add -f rag/embeddings.npy rag/config_rag.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Índice del manual y evaluación del buscador"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break || sleep 15; done

  imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar dependencias (PyTorch para CPU)
        run: |
          python -m pip install --quiet torch==2.14.1 torchvision==0.29.1 --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet timm==1.0.31 kagglehub==1.0.3 pandas scikit-learn scipy matplotlib "Pillow==11.3.0" jupyter nbconvert ipykernel
      - name: Ejecutar el notebook de comparación
        working-directory: notebooks
        env:
          MPLBACKEND: Agg
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=-1 03_imagenes_comparacion.ipynb
      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/03_imagenes_comparacion.ipynb notebooks/resultados_imagenes/resultados_imagenes.json notebooks/resultados_imagenes/matrices_imagenes.png
          git diff --cached --quiet && exit 0
          git commit -m "Resultados de la comparación de modelos de imágenes"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break || sleep 15; done
